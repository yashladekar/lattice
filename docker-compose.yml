name: notes-learning

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "3100:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/notes-learning
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - notes-learning_uploads:/app/apps/server/storage
    restart: unless-stopped

  # Applies the committed migrations once, before the API starts. Keeping it
  # out of the server image lets that image stay pruned and run unprivileged.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/notes-learning
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    container_name: notes-learning-postgres
    environment:
      POSTGRES_DB: notes-learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - notes-learning_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  notes-learning_postgres_data:
  notes-learning_uploads:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env
